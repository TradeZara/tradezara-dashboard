name: Refresh dashboard

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# um disparo manual em cima do cron corre para o mesmo push
concurrency: refresh-dashboard

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Testes
        run: node --test

      # O GITHUB_TOKEN padrão só enxerga este repositório; os repos medidos são
      # privados, daí o token de organização com leitura de repos e metadados.
      - name: Gerar index.html
        env:
          GITHUB_TOKEN: ${{ secrets.DASHBOARD_READ_TOKEN }}
        run: node generate.mjs

      - name: Commitar se mudou
        run: |
          if git diff --quiet index.html; then
            echo "sem mudanças — nada a commitar"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh dashboard" index.html
          git push
