name: Refresh dashboard

on:
  schedule:
    # every 6h. Every run commits (the badge carries the sync timestamp), and every
    # commit fires a Pages build — a shorter interval piles deploys on each other.
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# a manual dispatch on top of the cron races for the same push
concurrency: refresh-dashboard

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Tests
        run: node --test

      # The default GITHUB_TOKEN only sees this repository; the repos we measure
      # are private, hence an org token with read access to repos and members.
      - name: Generate index.html
        env:
          GITHUB_TOKEN: ${{ secrets.DASHBOARD_READ_TOKEN }}
        run: node generate.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet index.html; then
            echo "no changes — nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh dashboard" index.html
          git push

      # Pages deploys via Actions: the legacy branch-deploy pipeline for this
      # repo is stuck (deploys queue for 10 min and time out), so we publish
      # the artifact ourselves and skip that pipeline entirely.
      - name: Package site
        run: mkdir -p _site && cp index.html _site/

      - uses: actions/upload-pages-artifact@v3

      - id: deployment
        uses: actions/deploy-pages@v4
